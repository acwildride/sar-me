<title>Anmelden · Accedi · SAR Meran</title>
<script>(function(){var l=null;try{l=localStorage.getItem('sarme_lang')}catch(e){}if(!l)l=((navigator.language||'').slice(0,2)==='it')?'it':'de';document.documentElement.setAttribute('data-lang',l);document.documentElement.lang=l;})();</script>
<link rel="stylesheet" href="assets/sarme.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:16px}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(6px) brightness(.35);transform:scale(1.05);z-index:-1}
.login{width:100%;max-width:360px;background:rgba(26,26,26,.88);border:1px solid var(--line);border-radius:14px;padding:28px 24px;backdrop-filter:blur(6px);position:relative}
.login .dot{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#e0663a);display:grid;place-items:center;color:#111;margin-bottom:14px}
.login h1{font-size:22px;margin:0 0 4px}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.login label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.login input{width:100%;background:#111;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;font-size:15px}
.login input:focus{outline:none;border-color:var(--accent)}
.login .row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:var(--muted)}
.login .row input{width:16px;height:16px;accent-color:var(--accent)}
.login .go{width:100%;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.login .go:hover{background:#fff}
.login .langsw{position:absolute;top:18px;right:18px}
.err{color:var(--up);font-size:13px;min-height:18px;margin-top:10px}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head>
<body>
<div class="bg" id="bg"></div>
<form class="login" id="f" autocomplete="off">
  <div class="seg langsw"><button type="button" data-l="de">DE</button><button type="button" data-l="it">IT</button></div>
  <div class="dot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></div>
  <h1>SAR Meran</h1>
  <p><span class="i-de">Dienstplan · Anästhesie, Intensiv &amp; Notarzt</span><span class="i-it">Piano turni · Anestesia, rianimazione e Notarzt</span></p>
  <label for="pw"><span class="i-de">Passwort</span><span class="i-it">Password</span></label>
  <input type="password" id="pw" autofocus>
  <div class="row"><input type="checkbox" id="merken" checked><label for="merken" style="margin:0"><span class="i-de">Auf diesem Gerät angemeldet bleiben</span><span class="i-it">Resta connesso su questo dispositivo</span></label></div>
  <button type="submit" class="go"><span class="i-de">Anmelden</span><span class="i-it">Accedi</span></button>
  <div class="err" id="err"></div>
</form>
